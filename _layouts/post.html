<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }}｜狐狸的小天地</title>
  <meta name="description" content="{{ page.summary }}" />
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
</head>
<body>
  <div class="grain"></div>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">🦊</span>
      <span><strong>狐狸的小天地</strong><small>Luna's Little World</small></span>
    </a>
    <nav class="nav post-nav">
      <a href="{{ '/' | relative_url }}#notes">回狐狸手札</a>
      <a href="{{ '/' | relative_url }}">回首頁</a>
    </nav>
  </header>
  <main class="article-shell">
    <article class="article">
      <div class="article-kicker">FOX NOTES</div>
      <h1>{{ page.title }}</h1>
      <div class="article-meta">
        <span>{{ page.date | date: "%Y.%m.%d" }}</span>
        <span>{{ page.reading_time | default: "3 min" }}</span>
        <span># {{ page.tag | default: "狐狸手札" }}</span>
      </div>
      <div class="article-body">{{ content }}</div>
      <div class="article-end"><span>🦊🤍🦌</span><p>謝謝妳走進來，把這篇讀完。</p></div>
    </article>
  </main>
  <footer><span>Built slowly, kept gently.</span><span>🦊🤍🦌</span></footer>
</body>
</html>

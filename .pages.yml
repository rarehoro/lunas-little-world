media:
  - name: lulu_images
    label: 小鹿圖片
    input: assets/images/lulu
    output: /lunas-little-world/assets/images/lulu
    extensions: [jpg, jpeg, png, webp, gif]
    categories: [image]
    rename: safe

content:
  - name: window_notes
    label: 窗邊便箋
    type: file
    path: _data/window_notes.yml
    format: yaml
    fields:
      - name: lulu
        label: 🦌 小鹿的便箋 · Lulu
        type: object
        description: 直接修改這張，儲存後取代小鹿原本的便箋，不會增加張數。不必每天更新；請勿寫入私密資訊。
        fields:
          - name: text
            label: 想說的話
            type: text
            required: true
            description: 一句話或幾行碎念都可以，換行會原樣保留。
          - name: date
            label: 日期（可留白）
            type: date
            options:
              time: false
              format: "yyyy-MM-dd"
          - name: published
            label: 掛在窗邊
            type: boolean
            default: false
            description: 打開後儲存，便箋才會顯示在首頁。
      - name: luna
        label: 🦊 狐狸的便箋 · Luna
        type: object
        description: 狐狸固定的一張紙條；更新會取代舊內容，不影響小鹿的便箋。公開儲存庫裡的舊版本與未掛出內容仍非私密。
        fields:
          - name: text
            label: 想說的話
            type: text
            required: true
            description: 一句話或幾行碎念都可以，換行會原樣保留。
          - name: date
            label: 日期（可留白）
            type: date
            options:
              time: false
              format: "yyyy-MM-dd"
          - name: published
            label: 掛在窗邊
            type: boolean
            default: false
            description: 打開後儲存，便箋才會顯示在首頁。
  - name: lulu_notes
    label: 小鹿手札
    type: collection
    path: _lulu_notes
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: false
    view:
      primary: title
      fields: [title, date, published, tag]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: layout
        type: string
        default: lulu-post
        hidden: true
      - name: author
        type: string
        default: Lulu
        hidden: true
      - name: title
        label: 文章標題
        type: string
        required: true
      - name: date
        label: 日期與時間
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss xxx"
      - name: summary
        label: 一句摘要
        type: text
        required: true
        description: 這句話會出現在小鹿手札的文章卡片上。
      - name: tag
        label: 分類
        type: select
        default: 小鹿手札
        options:
          values: [小鹿手札, 生活片段, 心情隨筆, 旅行日記, 親子日常, 音樂記憶]
      - name: cover
        label: 封面圖片（可留白）
        type: image
        required: false
        options:
          media: lulu_images
          path: covers
          rename: safe
      - name: published
        label: 正式公開
        type: boolean
        default: false
        description: 關閉時只儲存草稿，不會出現在公開小屋；準備好後再打開。
      - name: body
        label: 文章內容
        type: rich-text
        required: true
        options:
          format: markdown
          media: lulu_images
          path: posts
          rename: safe
          switcher: true
